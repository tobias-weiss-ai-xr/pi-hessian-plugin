name: Docker Build and Push

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tobias-weiss-ai-xr/pi-hessian-plugin
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=Hessian.AI Plugin for pi
            org.opencontainers.image.description=Hessian.AI plugin for pi coding agent
            org.opencontainers.image.url=https://github.com/${{ env.IMAGE_NAME }}
            org.opencontainers.image.licenses=MIT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image (native arch)
        run: |
          docker build -t test-image .

      - name: Run smoke test
        run: |
          docker run --rm test-image sh -c '
            echo "=== Smoke Test ==="
            echo "1. user:              $(whoami)"
            test -f /home/pluginuser/src/hessian.ts && echo "2. src/hessian.ts:       OK"
            test -f /home/pluginuser/src/hessian-memory.ts && echo "3. src/hessian-memory.ts: OK"
            test -f /home/pluginuser/src/types.ts && echo "4. src/types.ts:          OK"
            test -f /home/pluginuser/src/generate-hessian-config.sh && echo "5. generate script:      OK"
            test -f /home/pluginuser/src/validate-config.sh && echo "6. validate script:      OK"
            test -f /home/pluginuser/schema/placeholder.json && echo "7. schema:               OK"
            test -f /home/pluginuser/.config/pi/plugins/hessian/hessian.ts && echo "8. plugin hessian.ts:    OK"
            test -f /home/pluginuser/.config/pi/plugins/hessian/schema/placeholder.json && echo "9. plugin schema:        OK"
            test -f /home/pluginuser/.config/pi/plugins/hessian/skills/hessian-models.md && echo "10. plugin skills:       OK"
          '

      - name: Run TypeScript check
        run: |
          docker run --rm test-image sh -c '
            cd /home/pluginuser && npx tsc --noEmit --skipLibCheck 2>&1 && echo "TypeScript: OK"
          ' || echo "TypeScript check: warnings (non-blocking)"
