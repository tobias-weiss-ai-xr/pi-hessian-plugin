name: Docker Build and Push

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tobias-weiss-ai-xr/pi-hessian-plugin
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=Hessian.AI Plugin for pi
            org.opencontainers.image.description=Hessian.AI plugin for pi coding agent
            org.opencontainers.image.url=https://github.com/${{ env.IMAGE_NAME }}
            org.opencontainers.image.licenses=MIT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Run Tests
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run container test
        run: |
          docker run --rm \
            ghcr.io/${{ env.IMAGE_NAME }}:latest \
            echo "Container test passed" | grep -q "Container test passed"

      - name: Run file structure test
        run: |
          docker run --rm \
            ghcr.io/${{ env.IMAGE_NAME }}:latest \
            test -f /home/pluginuser/src/hessian.ts && \
            test -f /home/pluginuser/src/hessian-memory.ts && \
            test -f /home/pluginuser/src/generate-hessian-config.sh && \
            echo "File structure test passed"

      - name: Verify plugin directory
        run: |
          docker run --rm \
            ghcr.io/${{ env.IMAGE_NAME }}:latest \
            test -f /home/pluginuser/.config/pi/plugins/hessian/hessian.ts && \
            echo "Plugin directory test passed"
